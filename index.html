<section class="hero">

    <div class="hero-photo hidden" id="heroPhoto"><img id="heroImg" alt=""></div>
    <h1 id="heroName"></h1>
    <p class="hero-title" id="heroTitle"></p>
    <div class="hero-badges">
      <span class="hero-badge" id="heroBadge"></span>
      <span class="hero-badge hero-badge-alt" id="heroBadge2"></span>
    </div>
    <div class="hero-cta">
      <a class="btn primary" id="heroLinkedin" target="_blank" rel="noopener" data-i18n="cta_linkedin">LinkedIn</a>
      <a class="btn ghost" href="#contact" data-tablink="contact" data-i18n="cta_contact">تواصل معي</a>
    </div>
  </div>
</section>

<main class="wrap main">
  <div class="tabs-wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="Site sections">
    <button class="tab" id="tab-about" data-tab="about" role="tab" aria-selected="true" aria-controls="panel-about" tabindex="0" data-i18n="tab_about">نبذة</button>
    <button class="tab" id="tab-experience" data-tab="experience" role="tab" aria-selected="false" aria-controls="panel-experience" tabindex="-1" data-i18n="tab_exp">الخبرات</button>
    <button class="tab" id="tab-skills" data-tab="skills" role="tab" aria-selected="false" aria-controls="panel-skills" tabindex="-1" data-i18n="tab_skills">المهارات والتعليم</button>

  </div>

    <p id="aboutText" class="lead"></p>
    <div class="facts" id="facts"></div>

  <section class="panel hidden" id="panel-experience" role="tabpanel" aria-labelledby="tab-experience">
    <h2 data-i18n="sec_exp">الخبرات العملية</h2>

    </div>

      <input type="text" id="cfName" data-i18n-ph="cf_name" placeholder="الاسم" required maxlength="100">
      <input type="text" id="cfContact" data-i18n-ph="cf_contact" placeholder="وسيلة التواصل (اختياري)" maxlength="150">
      <textarea id="cfMsg" data-i18n-ph="cf_msg" placeholder="رسالتك" required maxlength="2000" rows="4"></textarea>
      <button class="btn primary" type="submit" data-i18n="cf_send">إرسال</button>
      <p class="form-note" id="cfNote"></p>

  <form class="chat-form" id="chatForm">
    <input type="text" id="chatInput" data-i18n-ph="chat_ph" placeholder="اسأل عن أحمد..." maxlength="500" autocomplete="off">
    <button type="submit" aria-label="Send">➤</button>
  </form>
